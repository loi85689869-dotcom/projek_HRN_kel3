
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>CPU Scheduling Simulator</h1>
        <p>Simulasi Algoritma Penjadwalan Proses pada Sistem Operasi</p>
    </header>

    <main class="container">

        <!-- Input Proses -->
        <section class="panel">
            <h2>Input Proses</h2>

            <div class="form-group">
                <label for="algorithm">Pilih Algoritma</label>
                <select id="algorithm">
                    <option value="fcfs">FCFS (Non-Preemptive)</option>
                    <option value="sjf">SJF (Non-Preemptive)</option>
                    <option value="srtf">SRTF (Preemptive)</option>
                    <option value="rr">Round Robin (Preemptive)</option>
                </select>
                <select id="algorithm">
                    <option value="hrn">HRN (Non-Preemptive)</option>
                    <option value="fcfs">FCFS (Non-Preemptive)</option>
                    <option value="sjf">SJF (Non-Preemptive)</option>
                    <option value="srtf">SRTF (Preemptive)</option>
                    <option value="rr">Round Robin (Preemptive)</option>
                </select>
            </div>

            <div class="form-group" id="quantumGroup" hidden>
                <label for="quantum">Time Quantum</label>
                <input type="number" id="quantum" min="1" value="2">
            </div>

            <div class="form-group">
                <label for="processCount">Jumlah Proses (1–6)</label>
                <input type="number" id="processCount"
                       min="1" max="6" value="5">
            </div>

            <button type="button" id="generateBtn">
                Buat Input Proses
            </button>

            <div id="processInputs"></div>

            <button type="button" id="calculateBtn">
                Hitung Penjadwalan
            </button>

            <p id="message" class="message"></p>
        </section>

        <!-- Gantt Chart -->
        <section class="panel">
            <h2>Gantt Chart</h2>
            <div id="ganttChart" class="gantt-container">
                Hasil Gantt Chart akan ditampilkan di sini.
            </div>
        </section>

        <!-- Hasil Perhitungan -->
        <section class="panel">
            <h2>Hasil Perhitungan</h2>
            <div id="results"></div>
        </section>

        <!-- Rata-rata -->
        <section class="panel">
            <h2>Rata-rata Perhitungan</h2>
            <div id="averages"></div>
        </section>

    </main>

    <footer>
        <p>CPU Scheduling Simulator | Mata Kuliah Sistem Operasi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
